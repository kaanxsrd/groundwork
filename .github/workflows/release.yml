# Publishes @vantedev/groundwork to npm, with provenance, when a tag like v0.2.0 is pushed.
# Runs in the protected "npm" environment, so a maintainer approves each publish. Uses npm trusted
# publishing (OIDC), set up after the first release was published by hand. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"
  TEST_DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:54330/groundwork

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer. Pinned to a major, so a new npm release
      # can't change the publish environment unannounced.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile

      - name: Tag matches the version, and nothing is left unreleased
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
          if ls .changeset/*.md 2>/dev/null | grep -v '/README.md$'; then
            echo "::error::Unreleased changesets: run 'bun x changeset version' and commit first"; exit 1
          fi
          node -e "const p=require('./package.json'); if (!p.repository || p.publishConfig?.access !== 'public') { console.error('::error::package.json needs repository and publishConfig.access public'); process.exit(1) }"
          # CI passes on a Drizzle release candidate, but a peer range that needs one fails
          # `npm install` for everyone whose drizzle-orm comes from npm's latest tag.
          node -e "const p=require('./package.json'); const v=[p.peerDependencies['drizzle-orm'], p.devDependencies['drizzle-orm'], p.devDependencies['drizzle-kit']]; if (v.some((x) => x.includes('-'))) { console.error('::error::drizzle-orm and drizzle-kit must be stable releases, not ' + v.join(', ')); process.exit(1) }"
          # CI installs the example from the packed tarball, so only this catches a stale range.
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ "${VERSION%%.*}" = "0" ]; then WANT="^0.$MINOR.0"; else WANT="^${VERSION%%.*}.0.0"; fi
          EXAMPLE=$(node -p "require('./examples/next-app/package.json').dependencies['@vantedev/groundwork']")
          if [ "$EXAMPLE" != "$WANT" ]; then
            echo "::error::examples/next-app depends on @vantedev/groundwork $EXAMPLE, not $WANT"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run db:up
      - run: bun run test
      # Builds, then publint, are-the-types-wrong, and the packed tarball in a fresh project.
      - run: bun run smoke

      # Trusted publishing: npm trades the job's OIDC token for a publish token, so no secret is
      # stored. A version that's already on npm (the hand-published first release) is skipped.
      - name: Publish to npm with provenance
        run: |
          if npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$PACKAGE@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public

      # npm logs why the OIDC exchange failed only at verbose level, so ENEEDAUTH alone says nothing.
      - name: Why npm refused the publish
        if: failure()
        run: grep -hi "oidc" ~/.npm/_logs/*-debug-0.log || echo "npm logged nothing about OIDC."
