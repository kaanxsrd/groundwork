name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  check:
    name: Biome, typecheck, unit tests, migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test:unit
      - name: Migrations are up to date with the fixture schema
        run: bun run db:drift
      - name: The API reference is up to date with the source
        run: |
          bun run docs:api
          if [ -n "$(git status --porcelain -- docs/api)" ]; then
            git status --short -- docs/api
            echo "::error::docs/api is out of date: run 'bun run docs:api' and commit the result"; exit 1
          fi

  integration:
    # Oldest and newest supported Postgres majors, each with both drivers. Once more with a
    # postgres-js client that renames every result column (postgres.pascal), as an app's might.
    name: Integration (Postgres ${{ matrix.postgres }}, ${{ matrix.driver }}${{ matrix.transform && format(', postgres.{0}', matrix.transform) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
        driver: [postgres-js, node-postgres]
        transform: [""]
        include:
          - { postgres: "18", driver: postgres-js, transform: pascal }
    env:
      # The same docker-compose.yml as local development, so CI and laptops run the same server.
      POSTGRES_VERSION: ${{ matrix.postgres }}
      GW_TEST_DRIVER: ${{ matrix.driver }}
      GW_TEST_TRANSFORM: ${{ matrix.transform }}
      TEST_DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:54330/groundwork
      TEST_REDIS_URL: redis://127.0.0.1:63790
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - run: bun run db:up
      - run: bun run test:integration
      - name: Again with parallel workers (the harness must be safe across processes)
        run: bun test tests/integration --parallel=4
      - name: Database logs
        if: failure()
        run: docker compose logs

  drizzle-next:
    # groundwork moves to Drizzle 1.0 once it's released (PLAN.md section 9). Until then this runs
    # the suite against Drizzle's release candidate, so the move stays small. It doesn't fail the
    # workflow: a new release candidate can break here before groundwork has had a chance to change.
    name: Drizzle 1.0 release candidate (Postgres 18, both drivers)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      POSTGRES_VERSION: "18"
      TEST_DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:54330/groundwork
      TEST_REDIS_URL: redis://127.0.0.1:63790
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - name: Install drizzle-orm and drizzle-kit from the rc tag
        run: bun add --dev --exact drizzle-orm@rc drizzle-kit@rc
      # Drizzle 1.0's migrate() and drizzle-kit refuse the old folder format, as they do for apps.
      - name: Convert tests/migrations to drizzle-kit 1.0's folder format
        run: bun x drizzle-kit up --dialect postgresql --out tests/migrations
      # src only: the test harness's database type is written for Drizzle 0.45.
      - name: src type-checks against Drizzle 1.0
        run: bun x tsc --noEmit -p tsconfig.build.json
      - name: drizzle-kit 1.0 finds no changes in the fixture schema
        run: bun run db:drift
      - run: bun run db:up
      - name: Integration tests with postgres-js
        run: bun run test:integration
        env: { GW_TEST_DRIVER: postgres-js }
      - name: Integration tests with node-postgres
        run: bun run test:integration
        env: { GW_TEST_DRIVER: node-postgres }
      - name: Database logs
        if: failure()
        run: docker compose logs

  smoke:
    name: Built package on Node 22
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:54330/groundwork
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run db:up
      # Build, publint, are-the-types-wrong, then install the packed tarball into a fresh project:
      # import every subpath and rate-limit against Postgres on Node 22, and type-check a consumer
      # with TypeScript 5.9, 6.0 and 7.0.
      - run: bun run smoke

  example:
    name: Next.js example and README quickstart
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://groundwork:groundwork@127.0.0.1:54330/groundwork
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bun run db:up
      # Packs groundwork, then builds two apps outside the repo with `next build` and drives them
      # over HTTP with `next start`: examples/next-app (every module), and a fresh
      # create-next-app project with the README quickstart's files and commands pasted in.
      - run: bun run example
